# Builds the PRODUCTION edition and publishes it to GitHub Pages.
#
# Production = the `main` branch only. Pages is set to "GitHub Actions"
# and the github-pages environment only accepts deployments from main.
# Unreleased work (develop, feature branches) is never pushed to this
# public repository at all: see docs/EDITORIAL_WORKFLOW.md.
name: Build & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Production carries no unreleased issue (source)
        run: node scripts/pre-push.mjs --check HEAD
      # astro build + scripts/verify-production.mjs (draft-leak check on dist/)
      - run: npm run build
      - name: Issue 001 must stay frozen
        run: npm run verify:001
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Only a push to main deploys (never a pull request or another branch),
    # and only while the DEPLOY_ENABLED repository variable is true.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
