# Builds the site and publishes it to GitHub Pages.
# INACTIVE until the repository's Pages source is switched to "GitHub Actions"
# (Settings → Pages). Until then this workflow only builds and verifies.
name: Build & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Issue 001 must stay frozen
        run: npm run verify:001
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Only deploys from main, and only once Pages is set to "GitHub Actions"
    # and the DEPLOY_ENABLED repository variable is set to true.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
